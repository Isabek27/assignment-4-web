<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AITU Portal-Student Support</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Astana IT University</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="index.html">Student Support</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="register.html">Portal Registration</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        
        <div class="card shadow-sm">
          <div class="card-header bg-white py-3">
            <h4 class="card-title mb-0 text-center text-primary fw-bold">AITU Student Support</h4>
          </div>
          <div class="card-body p-4">
            <form action="#" method="POST">
              
              <div class="mb-3">
                <label for="userName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="userName" placeholder="Name Surname" required maxlength="50">
              </div>

              <div class="mb-3">
                <label for="userEmail" class="form-label">AITU Email Address</label>
                <input type="email" class="form-control" id="userEmail" placeholder="2xxx@astanait.edu.kz" required>
              </div>

              <div class="mb-3">
                <label for="userMessage" class="form-label">Inquiry/Issue Description</label>
                <textarea class="form-control" id="userMessage" rows="4" placeholder="Type your description here..." required></textarea>
              </div>
              <button class="btn btn-primary w-100" type="submit">Submit Form</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
