<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AITU Portal-Student Support</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Astana IT University</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Student Support</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="register.html">Portal Registration</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <div class="card shadow-sm">
          <div class="card-header bg-white py-3">
            <h4 class="card-title mb-0 text-center text-primary fw-bold">AITU Student Account Registration</h4>
          </div>
          <div class="card-body p-4">
            
            <form action="#" method="POST">
              <div class="row g-3">
                
                <div class="col-md-6">
                  <label for="firstName" class="form-label">First Name</label>
                  <input type="text" class="form-control" id="firstName" placeholder="Name" required>
                </div>

                <div class="col-md-6">
                  <label for="lastName" class="form-label">Last Name</label>
                  <input type="text" class="form-control" id="lastName" placeholder="Last Name" required>
                </div>

                <div class="col-12">
                  <label for="email" class="form-label">AITU Email Address</label>
                  <input type="email" class="form-control" id="email" placeholder="2xxx@astanait.edu.kz" required>
                </div>

                <div class="col-md-6">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="password" minlength="8" placeholder="Min 8 characters" required>
                </div>

                <div class="col-md-6">
                  <label for="confirmPassword" class="form-label">Confirm Password</label>
                  <input type="password" class="form-control" id="confirmPassword" minlength="8" placeholder="Repeat password" required>
                </div>

                <div class="col-md-6">
                  <label class="form-label d-block">Gender</label>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="male" value="male" required>
                    <label class="form-check-label" for="male">Male</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="female" value="female" required>
                    <label class="form-check-label" for="female">Female</label>
                  </div>
                </div>

                <div class="col-md-6">
                  <label for="country" class="form-label">Country</label>
                  <select class="form-select" id="country" required>
                    <option value="" selected disabled>Choose country...</option>
                    <option value="KZ">Kazakhstan</option>
                    <option value="US">United States</option>
                    <option value="UK">United Kingdom</option>
                  </select>
                </div>

                <div class="col-12">
                  <label class="form-label d-block">Hobbies</label>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="coding" value="coding">
                    <label class="form-check-label" for="coding">Coding</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="sports" value="sports">
                    <label class="form-check-label" for="sports">Sports</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="reading" value="reading">
                    <label class="form-check-label" for="reading">Reading</label>
                  </div>
                </div>

                <div class="col-12 d-flex gap-2 mt-4">
                  <button class="btn btn-primary flex-grow-1" type="submit">Register</button>
                  <button class="btn btn-secondary" type="reset">Reset</button>
                </div>

              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</html>
